plugins {
    id 'com.android.application'
}

def requestedConfigKey = (project.findProperty('PZ_STOREFRONT_CONFIG')
        ?: System.getenv('PZ_STOREFRONT_CONFIG')
        ?: 'powerzona').toString().trim()
if (!(requestedConfigKey ==~ /[a-z0-9][a-z0-9-]{1,62}/)) {
    throw new GradleException('PZ_STOREFRONT_CONFIG debe ser una clave de configuracion segura.')
}
def externalConfigPath = System.getenv('PZ_STOREFRONT_CONFIG_FILE')?.trim()
def storeConfigFile = externalConfigPath ? new File(externalConfigPath) : rootProject.file("config/${requestedConfigKey}.properties")
if (!storeConfigFile.exists()) {
    throw new GradleException("Falta la configuracion storefront ${requestedConfigKey}.")
}
def storeProperties = new Properties()
storeConfigFile.withReader('UTF-8') { reader -> storeProperties.load(reader) }

def configuredValue = { String projectProperty, String configProperty ->
    (project.findProperty(projectProperty) ?: storeProperties.getProperty(configProperty) ?: '')
            .toString().trim()
}

def brandKey = configuredValue('PZ_STOREFRONT_BRAND_KEY', 'brand.key')
def externalBrandConfigPath = System.getenv('PZ_STOREFRONT_BRAND_CONFIG_FILE')?.trim()
def brandConfigFile = externalBrandConfigPath ? new File(externalBrandConfigPath) : rootProject.file("brands/${brandKey}/brand.json")
if (!brandConfigFile.exists()) {
    throw new GradleException("Falta brands/${brandKey}/brand.json para la variante configurada.")
}
def brandConfig = new groovy.json.JsonSlurper().parseText(brandConfigFile.getText('UTF-8')) as Map
def brandDirectory = brandConfigFile.parentFile
def brandAsset = { String key ->
    def entry = (brandConfig.assets as Map)?.get(key) as Map
    entry ? new File(brandDirectory, entry.file?.toString() ?: '') : null
}
def sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) != -1) digest.update(buffer, 0, read)
    }
    digest.digest().encodeHex().toString()
}

def validateBrandAsset = { String key ->
    def entry = (brandConfig.assets as Map)?.get(key) as Map
    def file = brandAsset(key)
    def expected = entry?.sha256?.toString()?.trim()?.toLowerCase()
    if (file == null || !file.exists() || !(expected ==~ /[a-f0-9]{64}/) || sha256(file) != expected) {
        throw new GradleException("El recurso ${key} de ${brandKey} no coincide con su hash versionado.")
    }
    def extension = file.name.tokenize('.').last().toLowerCase()
    if (!['png', 'webp', 'xml'].contains(extension)) {
        throw new GradleException("El recurso ${key} debe ser PNG, WebP o XML vectorial.")
    }
    if (externalBrandConfigPath) {
        def inheritedEngineAsset = entry.normalizer_version?.toString() == 'engine-brand-v1'
        def expectedWidth = inheritedEngineAsset ? (entry.width as Integer) : (key == 'icon' ? 1024 : 1080)
        def expectedHeight = inheritedEngineAsset ? (entry.height as Integer) : (key == 'icon' ? 1024 : 1920)
        def decoded = javax.imageio.ImageIO.read(file)
        if (extension != 'png'
                || !(file.name ==~ /${key}[-_][a-f0-9]{32}(_[A-Za-z0-9]{6,32})?\.png/)
                || decoded == null || decoded.width != expectedWidth || decoded.height != expectedHeight
                || (entry.width as Integer) != expectedWidth || (entry.height as Integer) != expectedHeight
                || (entry.bytes as Long) != file.length()
                || !(entry.normalizer_version?.toString() ==~ /[a-z0-9._-]{8,80}/)) {
            throw new GradleException("El recurso normalizado ${key} no cumple el contrato aprobado.")
        }
    }
}

def notificationIconEntry = (brandConfig.assets as Map)?.get('notification_icon') as Map
def notificationIconDirectory = brandDirectory
if (notificationIconEntry == null) {
    def engineBrandConfigFile = rootProject.file("brands/${brandKey}/brand.json")
    if (engineBrandConfigFile.exists()
            && engineBrandConfigFile.canonicalFile != brandConfigFile.canonicalFile) {
        def engineBrandConfig = new groovy.json.JsonSlurper().parseText(
                engineBrandConfigFile.getText('UTF-8')) as Map
        def engineNotificationIcon = (engineBrandConfig.assets as Map)?.get('notification_icon') as Map
        if (engineNotificationIcon != null
                && engineBrandConfig.brand_key == brandConfig.brand_key
                && engineBrandConfig.application_id == brandConfig.application_id) {
            notificationIconEntry = engineNotificationIcon
            notificationIconDirectory = engineBrandConfigFile.parentFile
        }
    }
}
def notificationIconFile = rootProject.file('app/src/main/res/drawable/ic_notification.xml')
if (notificationIconEntry != null) {
    notificationIconFile = new File(
            notificationIconDirectory,
            notificationIconEntry.file?.toString() ?: '')
    def expectedNotificationSha256 = notificationIconEntry.sha256?.toString()?.trim()?.toLowerCase()
    if (!notificationIconFile.exists()
            || notificationIconFile.canonicalFile.parentFile != notificationIconDirectory.canonicalFile
            || notificationIconFile.name.tokenize('.').last().toLowerCase() != 'xml'
            || !(expectedNotificationSha256 ==~ /[a-f0-9]{64}/)
            || sha256(notificationIconFile) != expectedNotificationSha256) {
        throw new GradleException("El recurso notification_icon de ${brandKey} no coincide con su hash versionado.")
    }
}

def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def playBundleMode = (project.findProperty('PZ_STOREFRONT_PLAY_BUNDLE') ?: 'false')
        .toString().trim().equalsIgnoreCase('true')
def releaseBundleRequested = requestedTasks.any { name -> name.contains('bundlerelease') }
def directReleaseRequested = requestedTasks.any { name ->
    name.contains('assemblerelease') || name.contains('installrelease')
}
if (releaseBundleRequested && !playBundleMode) {
    throw new GradleException('El AAB de Google Play exige PZ_STOREFRONT_PLAY_BUNDLE=true para retirar permisos de instalación privada.')
}
if (playBundleMode && directReleaseRequested) {
    throw new GradleException('PZ_STOREFRONT_PLAY_BUNDLE no puede usarse para fabricar el APK directo.')
}
def stagingPackagingRequested = requestedTasks.any { name ->
    name.contains('assemblestaging') || name.contains('bundlestaging') || name.contains('installstaging')
}
def releasePackagingRequested = requestedTasks.any { name ->
    name.contains('assemblerelease') || name.contains('bundlerelease') || name.contains('installrelease')
}
def publishablePackagingRequested = stagingPackagingRequested || releasePackagingRequested

def firebaseConfigFile = file('google-services.json')
if (firebaseConfigFile.exists() && publishablePackagingRequested) {
    apply plugin: 'com.google.gms.google-services'
}

def apiBaseUrl = (project.findProperty('PZ_STOREFRONT_API_BASE_URL') ?: '').toString().trim()
def storeUrl = configuredValue('PZ_STOREFRONT_STORE_URL', 'store.url')
def storeKey = configuredValue('PZ_STOREFRONT_STORE_KEY', 'store.key')
def stagingStoreUrl = apiBaseUrl ? "${apiBaseUrl}/t/${storeKey}" : ''
def appKey = configuredValue('PZ_STOREFRONT_APP_KEY', 'app.key')
def appDisplayName = configuredValue('PZ_STOREFRONT_APP_NAME', 'app.display_name')
def configuredApplicationId = configuredValue('PZ_STOREFRONT_APPLICATION_ID', 'application.id')
def configuredFirebaseProjectId = configuredValue('PZ_STOREFRONT_FIREBASE_PROJECT_ID', 'firebase.project_id')
def configuredDistribution = configuredValue('PZ_STOREFRONT_DISTRIBUTION', 'distribution')
def configuredPublishable = configuredValue('PZ_STOREFRONT_PUBLISHABLE', 'build.publishable').equalsIgnoreCase('true')
def configuredVersionCode = configuredValue('PZ_STOREFRONT_VERSION_CODE', 'version.code')
def configuredVersionName = configuredValue('PZ_STOREFRONT_VERSION_NAME', 'version.name')
def configuredSchemaVersion = configuredValue('PZ_STOREFRONT_SCHEMA_VERSION', 'schema.version')
def destructiveTestsEnabled = (project.findProperty('PZ_ALLOW_STAGING_DESTRUCTIVE_TESTS') ?: 'false')
        .toString().trim().equalsIgnoreCase('true')
def configuredSigningPropertiesPath = System.getenv('PZ_STOREFRONT_SIGNING_PROPERTIES')?.trim()
def signingPropertiesFile = configuredSigningPropertiesPath
        ? new File(configuredSigningPropertiesPath)
        : rootProject.file('../.secrets/mobile-storefront-staging.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.eachLine('UTF-8') { line ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith('#')) return
        def separator = trimmed.indexOf('=')
        if (separator > 0) {
            signingProperties.setProperty(
                    trimmed.substring(0, separator).trim(),
                    trimmed.substring(separator + 1).trim())
        }
    }
}
def signingConfigured = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { key ->
    signingProperties.getProperty(key)?.trim()
}

def validHttpsOrigin = { String value ->
    try {
        def parsed = new URI(value)
        def path = parsed.path ?: ''
        return parsed.scheme == 'https' && parsed.host && !parsed.userInfo
                && (parsed.port == -1 || parsed.port == 443) && (path == '' || path == '/')
                && !parsed.query && !parsed.fragment
    } catch (Exception ignored) { return false }
}

def validStoreUrl = { String value, String key ->
    try {
        def parsed = new URI(value)
        return parsed.scheme == 'https' && parsed.host && !parsed.userInfo
                && (parsed.port == -1 || parsed.port == 443) && parsed.path == "/t/${key}"
                && !parsed.query && !parsed.fragment && key ==~ /[a-z0-9][a-z0-9-]{1,62}/
    } catch (Exception ignored) { return false }
}

def httpsOriginFromStoreUrl = { String value ->
    try {
        def parsed = new URI(value)
        return "https://${parsed.host.toLowerCase()}"
    } catch (Exception ignored) { return '' }
}

if (configuredSchemaVersion != '1') {
    throw new GradleException('La configuracion debe declarar schema.version=1.')
}
if (!validStoreUrl(storeUrl, storeKey)) {
    throw new GradleException('store.url debe ser una URL HTTPS /t/{store.key} y coincidir con store.key.')
}
def productionApiBaseUrl = httpsOriginFromStoreUrl(storeUrl)
if (!validHttpsOrigin(productionApiBaseUrl)) {
    throw new GradleException('No se pudo derivar el origen HTTPS productivo desde store.url.')
}
if (!appDisplayName || appDisplayName.length() > 60 || appDisplayName.find(/[\p{Cntrl}]/)) {
    throw new GradleException('app.display_name debe contener entre 1 y 60 caracteres visibles.')
}
if (!(appKey ==~ /[a-z0-9][a-z0-9_-]{1,62}[a-z0-9]/)) {
    throw new GradleException('app.key debe ser una app_key publica valida.')
}
if (!(configuredApplicationId ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)) {
    throw new GradleException('application.id no es un paquete Android valido.')
}
if (!(configuredFirebaseProjectId ==~ /[a-z][a-z0-9-]{4,28}[a-z0-9]/)) {
    throw new GradleException('firebase.project_id no es valido.')
}
if (!['play_and_direct', 'direct'].contains(configuredDistribution)) {
    throw new GradleException('distribution debe ser play_and_direct o direct.')
}
if (storeKey == 'powerzona' && configuredDistribution != 'play_and_direct') {
    throw new GradleException('PowerZona debe conservar distribucion APK directa y AAB para Google Play.')
}
if (storeKey != 'powerzona' && configuredDistribution != 'direct') {
    throw new GradleException('Las tiendas tenant solo generan APK de distribucion directa.')
}
if (brandConfig.schema_version != 1
        || brandConfig.brand_key != brandKey
        || brandConfig.store_key != storeKey
        || brandConfig.display_name != appDisplayName
        || brandConfig.application_id != configuredApplicationId
        || brandConfig.store_url != storeUrl
        || brandConfig.publishable != configuredPublishable
        || (brandConfig.firebase_android as Map)?.project_id != configuredFirebaseProjectId
        || (brandConfig.firebase_android as Map)?.package_name != configuredApplicationId
        || (brandConfig.firebase_android as Map)?.tracked_in_git != false) {
    throw new GradleException("brands/${brandKey}/brand.json no coincide con la configuracion seleccionada.")
}
def palette = brandConfig.palette as Map
def requiredPalette = [
        'deep_sapphire', 'energy_cobalt', 'flash_blue', 'platinum', 'luminous_ice',
        'pearl_white', 'ink', 'secondary_text', 'base_background'
]
if (requiredPalette.any { !(palette?.get(it)?.toString() ==~ /#[A-Fa-f0-9]{6}/) }) {
    throw new GradleException("La paleta de ${brandKey} esta incompleta o contiene colores invalidos.")
}
def versionCodeValue
try { versionCodeValue = Integer.parseInt(configuredVersionCode) } catch (Exception ignored) { versionCodeValue = 0 }
if (versionCodeValue < 1 || versionCodeValue > 2_147_483_647
        || !(configuredVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('La version debe usar versionCode positivo y versionName semantico.')
}
validateBrandAsset('icon')
validateBrandAsset('splash')

def configDirectory = rootProject.file('config')
if (configDirectory.exists()) {
    def seenApplicationIds = [:]
    configDirectory.listFiles({ file -> file.name.endsWith('.properties') } as FileFilter)?.sort()?.each { file ->
        def candidate = new Properties()
        file.withReader('UTF-8') { reader -> candidate.load(reader) }
        def applicationId = candidate.getProperty('application.id')?.trim()
        if (applicationId && seenApplicationIds.containsKey(applicationId)) {
            throw new GradleException("application.id duplicado en ${seenApplicationIds[applicationId]} y ${file.name}.")
        }
        if (applicationId) seenApplicationIds[applicationId] = file.name
    }
    if (externalConfigPath
            && seenApplicationIds.containsKey(configuredApplicationId)
            && seenApplicationIds[configuredApplicationId] != "${requestedConfigKey}.properties") {
        throw new GradleException("application.id externo duplica ${seenApplicationIds[configuredApplicationId]}.")
    }
}

if (publishablePackagingRequested) {
    if (!configuredPublishable) throw new GradleException('La configuracion demo no es publicable ni firmable.')
    if (!signingConfigured) throw new GradleException('La firma no esta configurada en el runner privado.')
    if (releasePackagingRequested && !configuredSigningPropertiesPath) {
        throw new GradleException('Release exige PZ_STOREFRONT_SIGNING_PROPERTIES explicito; no usa la firma staging por defecto.')
    }
    if (!firebaseConfigFile.exists()) {
        throw new GradleException('Falta app/google-services.json local e ignorado por Git.')
    }
    def firebaseConfig = new groovy.json.JsonSlurper().parseText(firebaseConfigFile.getText('UTF-8')) as Map
    def firebaseProjectId = (firebaseConfig.project_info as Map)?.project_id?.toString()?.trim()
    def firebasePackages = ((firebaseConfig.client ?: []) as List).collect { client ->
        ((client.client_info as Map)?.android_client_info as Map)?.package_name?.toString()?.trim()
    }.findAll { it }
    if (firebaseProjectId != configuredFirebaseProjectId || !firebasePackages.contains(configuredApplicationId)) {
        throw new GradleException('google-services.json no coincide con firebase.project_id y application.id.')
    }
}
if (stagingPackagingRequested) {
    if (!validHttpsOrigin(apiBaseUrl)) {
        throw new GradleException('PZ_STOREFRONT_API_BASE_URL debe ser un origen HTTPS sin ruta, query ni fragmento.')
    }
    if (!validStoreUrl(stagingStoreUrl, storeKey)) {
        throw new GradleException('El storefront staging debe derivarse del origen HTTPS y store.key.')
    }
}

def javaStringLiteral = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def generatedBrandResDirectory = layout.buildDirectory.dir('generated/storefrontBrand/res')
def generateStorefrontBrandResources = tasks.register('generateStorefrontBrandResources') {
    inputs.file(brandConfigFile)
    inputs.file(brandAsset('icon'))
    inputs.file(brandAsset('splash'))
    inputs.file(notificationIconFile)
    outputs.dir(generatedBrandResDirectory)
    doLast {
        def output = generatedBrandResDirectory.get().asFile
        delete(output)
        ['icon', 'splash'].each { key ->
            def source = brandAsset(key)
            def extension = source.name.tokenize('.').last().toLowerCase()
            def resourceDirectory = new File(output, extension == 'xml' ? 'drawable' : 'drawable-nodpi')
            resourceDirectory.mkdirs()
            copy {
                from source
                into resourceDirectory
                rename { "storefront_${key}.${extension}" }
            }
        }
        def notificationExtension = notificationIconFile.name.tokenize('.').last().toLowerCase()
        def notificationResourceDirectory = new File(output, 'drawable')
        notificationResourceDirectory.mkdirs()
        copy {
            from notificationIconFile
            into notificationResourceDirectory
            rename { "storefront_notification_icon.${notificationExtension}" }
        }
    }
}

android {
    namespace 'com.tusenda84.storefront'
    compileSdk 36

    defaultConfig {
        applicationId configuredApplicationId
        minSdk 26
        targetSdk 36
        versionCode versionCodeValue
        versionName configuredVersionName

        buildConfigField 'String', 'API_BASE_URL', javaStringLiteral(apiBaseUrl)
        buildConfigField 'String', 'STORE_URL', javaStringLiteral(storeUrl)
        buildConfigField 'String', 'STORE_KEY', javaStringLiteral(storeKey)
        buildConfigField 'String', 'APP_KEY', javaStringLiteral(appKey)
        buildConfigField 'String', 'APP_DISPLAY_NAME', javaStringLiteral(appDisplayName)
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', javaStringLiteral(configuredFirebaseProjectId)
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', 'false'
        buildConfigField 'boolean', 'ALLOW_STAGING_DESTRUCTIVE_TESTS', destructiveTestsEnabled.toString()
        manifestPlaceholders = [storefrontAppName: appDisplayName]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        resValue 'color', 'storefront_brand_deep_sapphire', palette.deep_sapphire
        resValue 'color', 'storefront_brand_energy_cobalt', palette.energy_cobalt
        resValue 'color', 'storefront_brand_flash_blue', palette.flash_blue
        resValue 'color', 'storefront_brand_platinum', palette.platinum
        resValue 'color', 'storefront_brand_luminous_ice', palette.luminous_ice
        resValue 'color', 'storefront_brand_pearl_white', palette.pearl_white
        resValue 'color', 'storefront_brand_ink', palette.ink
        resValue 'color', 'storefront_brand_secondary_text', palette.secondary_text
        resValue 'color', 'storefront_brand_base_background', palette.base_background
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    sourceSets {
        main.res.srcDir(generatedBrandResDirectory.get().asFile)
        debug.manifest.srcFile('src/direct/AndroidManifest.xml')
        staging.manifest.srcFile('src/direct/AndroidManifest.xml')
        release.manifest.srcFile(playBundleMode
                ? 'src/play/AndroidManifest.xml'
                : 'src/direct/AndroidManifest.xml')
    }

    signingConfigs {
        storefront {
            if (signingConfigured) {
                def configuredStoreFile = new File(signingProperties.getProperty('storeFile'))
                storeFile configuredStoreFile.isAbsolute()
                        ? configuredStoreFile
                        : new File(signingPropertiesFile.parentFile, signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [storefrontAppName: "${appDisplayName} Debug"]
        }
        staging {
            initWith release
            matchingFallbacks = ['release']
            versionNameSuffix '-staging'
            buildConfigField 'String', 'STORE_URL', javaStringLiteral(stagingStoreUrl)
            buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigFile.exists().toString()
            manifestPlaceholders = [storefrontAppName: "${appDisplayName} Staging"]
            minifyEnabled false
            shrinkResources false
            if (signingConfigured) signingConfig signingConfigs.storefront
        }
        release {
            buildConfigField 'String', 'API_BASE_URL', javaStringLiteral(productionApiBaseUrl)
            buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigFile.exists().toString()
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigured) signingConfig signingConfigs.storefront
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.returnDefaultValues = true }
}

tasks.named('preBuild').configure { dependsOn(generateStorefrontBrandResources) }

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-installations'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-appset:16.1.0'

    testImplementation 'junit:junit:4.13.2'
}
