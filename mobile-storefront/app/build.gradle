plugins {
    id 'com.android.application'
}

def storeConfigFile = rootProject.file('config/powerzona.properties')
if (!storeConfigFile.exists()) {
    throw new GradleException('Falta config/powerzona.properties para la variante PowerZona C07.')
}
def storeProperties = new Properties()
storeConfigFile.withInputStream { stream -> storeProperties.load(stream) }

def configuredValue = { String projectProperty, String configProperty ->
    (project.findProperty(projectProperty) ?: storeProperties.getProperty(configProperty) ?: '')
            .toString().trim()
}

def brandKey = configuredValue('PZ_STOREFRONT_BRAND_KEY', 'brand.key')
def brandConfigFile = rootProject.file("brands/${brandKey}/brand.json")
if (!brandConfigFile.exists()) {
    throw new GradleException("Falta brands/${brandKey}/brand.json para la variante configurada.")
}
def brandConfig = new groovy.json.JsonSlurper().parseText(brandConfigFile.getText('UTF-8')) as Map
def brandDirectory = brandConfigFile.parentFile
def brandAsset = { String key ->
    def entry = (brandConfig.assets as Map)?.get(key) as Map
    entry ? new File(brandDirectory, entry.file?.toString() ?: '') : null
}
def sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) != -1) digest.update(buffer, 0, read)
    }
    digest.digest().encodeHex().toString()
}

def validateBrandAsset = { String key ->
    def entry = (brandConfig.assets as Map)?.get(key) as Map
    def file = brandAsset(key)
    def expected = entry?.sha256?.toString()?.trim()?.toLowerCase()
    if (file == null || !file.exists() || !(expected ==~ /[a-f0-9]{64}/) || sha256(file) != expected) {
        throw new GradleException("El recurso PowerZona ${key} no coincide con el maestro v3 aprobado.")
    }
}

def firebaseConfigFile = file('google-services.json')
if (firebaseConfigFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def apiBaseUrl = (project.findProperty('PZ_STOREFRONT_API_BASE_URL') ?: '').toString().trim()
def storeUrl = configuredValue('PZ_STOREFRONT_STORE_URL', 'store.url')
def storeKey = configuredValue('PZ_STOREFRONT_STORE_KEY', 'store.key')
def appDisplayName = configuredValue('PZ_STOREFRONT_APP_NAME', 'app.display_name')
def configuredApplicationId = configuredValue('PZ_STOREFRONT_APPLICATION_ID', 'application.id')
def configuredVersionCode = configuredValue('PZ_STOREFRONT_VERSION_CODE', 'version.code')
def configuredVersionName = configuredValue('PZ_STOREFRONT_VERSION_NAME', 'version.name')
def destructiveTestsEnabled = (project.findProperty('PZ_ALLOW_STAGING_DESTRUCTIVE_TESTS') ?: 'false')
        .toString().trim().equalsIgnoreCase('true')
def configuredSigningPropertiesPath = System.getenv('PZ_STOREFRONT_SIGNING_PROPERTIES')?.trim()
def signingPropertiesFile = configuredSigningPropertiesPath
        ? new File(configuredSigningPropertiesPath)
        : rootProject.file('../.secrets/mobile-storefront-staging.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { stream -> signingProperties.load(stream) }
}
def signingConfigured = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { key ->
    signingProperties.getProperty(key)?.trim()
}

def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def stagingPackagingRequested = requestedTasks.any { name ->
    name.contains('assemblestaging') || name.contains('bundlestaging') || name.contains('installstaging')
}
def releasePackagingRequested = requestedTasks.any { name ->
    name.contains('assemblerelease') || name.contains('bundlerelease') || name.contains('installrelease')
}

def validHttpsOrigin = { String value ->
    try {
        def parsed = new URI(value)
        def path = parsed.path ?: ''
        return parsed.scheme == 'https'
                && parsed.host
                && !parsed.userInfo
                && (parsed.port == -1 || parsed.port == 443)
                && (path == '' || path == '/')
                && !parsed.query
                && !parsed.fragment
    } catch (Exception ignored) {
        return false
    }
}

def validStoreUrl = { String value, String key ->
    try {
        def parsed = new URI(value)
        def expectedPath = "/t/${key}"
        return parsed.scheme == 'https'
                && parsed.host
                && !parsed.userInfo
                && (parsed.port == -1 || parsed.port == 443)
                && parsed.path == expectedPath
                && !parsed.query
                && !parsed.fragment
                && key ==~ /[a-z0-9][a-z0-9-]{1,62}/
    } catch (Exception ignored) {
        return false
    }
}

if (!validStoreUrl(storeUrl, storeKey)) {
    throw new GradleException(
            'PZ_STOREFRONT_STORE_URL debe ser una URL HTTPS /t/{store_key} y coincidir con PZ_STOREFRONT_STORE_KEY.'
    )
}
if (!appDisplayName || appDisplayName.length() > 60 || appDisplayName.find(/[\p{Cntrl}]/)) {
    throw new GradleException('PZ_STOREFRONT_APP_NAME debe contener entre 1 y 60 caracteres visibles.')
}
if (brandKey != 'powerzona'
        || storeKey != 'powerzona'
        || storeUrl != 'https://tusenda84.com/t/powerzona'
        || appDisplayName != 'PowerZona'
        || configuredApplicationId != 'com.tusenda84.powerzona') {
    throw new GradleException('La variante C07 debe conservar exactamente la identidad PowerZona aprobada.')
}
if (brandConfig.schema_version != 1
        || brandConfig.brand_key != brandKey
        || brandConfig.store_key != storeKey
        || brandConfig.display_name != appDisplayName
        || brandConfig.application_id != configuredApplicationId
        || brandConfig.store_url != storeUrl
        || (brandConfig.firebase_android as Map)?.package_name != configuredApplicationId
        || (brandConfig.firebase_android as Map)?.tracked_in_git != false) {
    throw new GradleException('brands/powerzona/brand.json no coincide con la configuración C07 autorizada.')
}
def versionCodeValue
try { versionCodeValue = Integer.parseInt(configuredVersionCode) } catch (Exception ignored) { versionCodeValue = 0 }
if (versionCodeValue < 1 || versionCodeValue > 2_147_483_647
        || !(configuredVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('La versión PowerZona debe usar versionCode positivo y versionName semántico.')
}
validateBrandAsset('icon')
validateBrandAsset('splash')

if (stagingPackagingRequested) {
    if (!signingConfigured) {
        throw new GradleException(
                'La firma de staging no esta configurada. Crea .secrets/mobile-storefront-staging.properties.'
        )
    }
    if (!firebaseConfigFile.exists()) {
        throw new GradleException('Falta mobile-storefront/app/google-services.json local e ignorado por Git.')
    }
    if (!validHttpsOrigin(apiBaseUrl)) {
        throw new GradleException('PZ_STOREFRONT_API_BASE_URL debe ser un origen HTTPS sin ruta, query ni fragmento.')
    }
}
if (releasePackagingRequested) {
    throw new GradleException('La variante release de produccion permanece fuera del alcance de PZ-APP-C07.')
}

def javaStringLiteral = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.tusenda84.storefront'
    compileSdk 36

    defaultConfig {
        applicationId configuredApplicationId
        minSdk 26
        targetSdk 36
        versionCode versionCodeValue
        versionName configuredVersionName

        buildConfigField 'String', 'API_BASE_URL', javaStringLiteral(apiBaseUrl)
        buildConfigField 'String', 'STORE_URL', javaStringLiteral(storeUrl)
        buildConfigField 'String', 'STORE_KEY', javaStringLiteral(storeKey)
        buildConfigField 'String', 'APP_DISPLAY_NAME', javaStringLiteral(appDisplayName)
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigFile.exists().toString()
        buildConfigField 'boolean', 'ALLOW_STAGING_DESTRUCTIVE_TESTS', destructiveTestsEnabled.toString()
        manifestPlaceholders = [storefrontAppName: appDisplayName]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        staging {
            if (signingConfigured) {
                storeFile new File(signingPropertiesFile.parentFile, signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [storefrontAppName: "${appDisplayName} Debug"]
        }
        staging {
            initWith release
            matchingFallbacks = ['release']
            versionNameSuffix '-staging'
            manifestPlaceholders = [storefrontAppName: "${appDisplayName} Staging"]
            minifyEnabled false
            shrinkResources false
            if (signingConfigured) signingConfig signingConfigs.staging
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-installations'
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
}
