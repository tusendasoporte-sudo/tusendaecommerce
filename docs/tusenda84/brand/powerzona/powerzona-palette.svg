<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Paleta oficial propuesta de PowerZona</title>
  <desc id="desc">Cinco muestras: Midnight, Electric Cyan, Energy Amber, Cloud White y Slate.</desc>
  <rect width="1200" height="440" fill="#F5FAFF"/>
  <text x="64" y="72" fill="#071A2B" font-family="Arial, sans-serif" font-size="36" font-weight="700">PowerZona · Paleta</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 112)">
      <rect width="200" height="210" rx="24" fill="#071A2B"/>
      <text x="20" y="162" fill="#F5FAFF" font-size="22" font-weight="700">Midnight</text>
      <text x="20" y="192" fill="#F5FAFF" font-size="18">#071A2B</text>
    </g>
    <g transform="translate(282 112)">
      <rect width="200" height="210" rx="24" fill="#14C8FF"/>
      <text x="20" y="162" fill="#071A2B" font-size="22" font-weight="700">Electric Cyan</text>
      <text x="20" y="192" fill="#071A2B" font-size="18">#14C8FF</text>
    </g>
    <g transform="translate(500 112)">
      <rect width="200" height="210" rx="24" fill="#FFB703"/>
      <text x="20" y="162" fill="#071A2B" font-size="22" font-weight="700">Energy Amber</text>
      <text x="20" y="192" fill="#071A2B" font-size="18">#FFB703</text>
    </g>
    <g transform="translate(718 112)">
      <rect width="200" height="210" rx="24" fill="#F5FAFF" stroke="#CBD5E1" stroke-width="3"/>
      <text x="20" y="162" fill="#071A2B" font-size="22" font-weight="700">Cloud White</text>
      <text x="20" y="192" fill="#071A2B" font-size="18">#F5FAFF</text>
    </g>
    <g transform="translate(936 112)">
      <rect width="200" height="210" rx="24" fill="#5F7285"/>
      <text x="20" y="162" fill="#F5FAFF" font-size="22" font-weight="700">Slate</text>
      <text x="20" y="192" fill="#F5FAFF" font-size="18">#5F7285</text>
    </g>
  </g>
  <text x="64" y="382" fill="#5F7285" font-family="Arial, sans-serif" font-size="20">Identidad white-label Premium · propuesta PZ-APP-C01</text>
</svg>
