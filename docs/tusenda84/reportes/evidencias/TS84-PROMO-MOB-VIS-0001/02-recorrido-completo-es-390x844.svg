  <line x1="16" y1="5060" x2="64" y2="5060" stroke="#c8a45a" stroke-width="2"/>
  <text x="16" y="5110" class="h2">Aladdin's Carpet</text>
  <text x="16" y="5150" class="body">Restauración especializada</text>
  <text x="16" y="5190" class="small">Atención y copy desde la revisión publicada.</text>
  <text x="16" y="5250" class="eyebrow">ENLACES</text>
  <text x="16" y="5284" class="meta">— INICIO</text><text x="16" y="5318" class="meta">— SERVICIOS</text><text x="16" y="5352" class="meta">— CONTACTO</text>
  <text x="16" y="5406" class="eyebrow">REDES TIPADAS</text>
  <rect x="16" y="5422" width="171" height="48" rx="8" class="card"/><text x="32" y="5452" class="meta">INSTAGRAM</text>
  <rect x="203" y="5422" width="171" height="48" rx="8" class="card"/><text x="219" y="5452" class="meta">FACEBOOK</text>
  <line x1="0" y1="5510" x2="390" y2="5510" stroke="#c8a45a" stroke-opacity=".22"/>
  <text x="195" y="5542" text-anchor="middle" class="small">Presencia promocional en</text>
  <text x="195" y="5570" text-anchor="middle" fill="#f6f1e7" font-family="Arial,sans-serif" font-size="14" font-weight="800">Tu Senda 84</text>

