  <text x="360" y="190" text-anchor="end" class="number">01</text>
  <text x="16" y="246" class="h1"><tspan x="16">Alfombras</tspan><tspan x="16" dy="44">con historia</tspan></text>
  <text x="16" y="354" class="body">Cuidado especializado</text>
