  <text x="16" y="1826" class="eyebrow">TRABAJO DESTACADO</text><text x="360" y="1822" text-anchor="end" class="number">03</text>
  <text x="16" y="1878" class="h2"><tspan x="16">Una pieza</tspan><tspan x="16" dy="38">recuperada</tspan></text>
