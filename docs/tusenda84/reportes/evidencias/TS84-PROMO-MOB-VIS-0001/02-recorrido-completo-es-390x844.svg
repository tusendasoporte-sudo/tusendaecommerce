    <line x1="0" y1="3376" x2="390" y2="3376" class="fold"/><text x="374" y="3370" text-anchor="end" class="foldtext">3376</text>
    <line x1="0" y1="4220" x2="390" y2="4220" class="fold"/><text x="374" y="4214" text-anchor="end" class="foldtext">4220</text>
    <line x1="0" y1="5064" x2="390" y2="5064" class="fold"/><text x="374" y="5058" text-anchor="end" class="foldtext">5064</text>
