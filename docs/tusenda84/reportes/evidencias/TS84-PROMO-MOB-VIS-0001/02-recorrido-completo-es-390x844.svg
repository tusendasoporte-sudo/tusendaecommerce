  <path d="M29 720h95" stroke="#c8a45a"/><path d="M29 727h62" stroke="#c8a45a" stroke-opacity=".6"/>
  <text x="195" y="602" text-anchor="middle" class="meta">MEDIA HERO PUBLICADA</text>
  <text x="195" y="624" text-anchor="middle" class="small">4:3 · una imagen/poster LCP · alt ES</text>
  <rect x="270" y="686" width="88" height="46" rx="23" fill="#090909" fill-opacity=".86" stroke="#f6f1e7" stroke-opacity=".3"/>
  <circle cx="296" cy="709" r="20" fill="none" stroke="#c8a45a"/><text x="296" y="713" text-anchor="middle" class="small">01</text>
  <circle cx="334" cy="709" r="20" fill="none" stroke="#c8a45a"/><text x="334" y="713" text-anchor="middle" class="small">02</text>
  <text x="16" y="805" class="small">Secundaria lazy · video preload none · sin autoplay</text>

