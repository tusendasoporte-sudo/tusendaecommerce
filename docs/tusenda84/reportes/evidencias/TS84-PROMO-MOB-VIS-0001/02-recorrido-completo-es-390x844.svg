    <text x="126" y="28" fill="#ead49b" font-family="Arial,sans-serif" font-size="13">★★★★★</text>
    <text x="126" y="52" class="meta">12 RESEÑAS</text>
  </g>
  <g clip-path="url(#reviews)">
