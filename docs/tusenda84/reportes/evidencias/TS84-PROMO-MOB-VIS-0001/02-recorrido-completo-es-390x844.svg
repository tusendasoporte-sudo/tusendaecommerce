      <text x="18" y="35" fill="#ead49b" font-family="Arial,sans-serif" font-size="14">★★★★★</text>
      <text x="18" y="76" fill="#f6f1e7" font-family="Georgia,serif" font-size="18" font-style="italic"><tspan x="18">Texto de reseña aprobada</tspan><tspan x="18" dy="27">en el locale efectivo.</tspan></text>
      <line x1="18" y1="188" x2="286" y2="188" stroke="#c8a45a" stroke-opacity=".3"/>
      <text x="18" y="218" class="meta">NOMBRE PUBLICADO</text><text x="18" y="239" class="small">fecha localizada</text>
    </g>
    <g transform="translate(334 4170)">
      <rect width="304" height="256" rx="8" class="card"/><text x="18" y="35" fill="#ead49b" font-family="Arial,sans-serif" font-size="14">★★★★★</text>
    </g>
  </g>
  <text x="16" y="4480" class="small">Scroller propio · scroll-snap · foco 3 px · sin overflow de página</text>

