  <text x="16" y="956" class="eyebrow">SERVICIOS</text><text x="360" y="952" text-anchor="end" class="number">02</text>
  <text x="16" y="1008" class="h2"><tspan x="16">Cuidado para</tspan><tspan x="16" dy="38">cada pieza</tspan></text>
  <text x="16" y="1090" class="body">Servicios especializados</text>
