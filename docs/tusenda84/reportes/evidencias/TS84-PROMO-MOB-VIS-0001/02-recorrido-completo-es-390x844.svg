  <text x="16" y="4576" class="eyebrow">CONTACTO</text><text x="360" y="4572" text-anchor="end" class="number">07</text>
  <text x="16" y="4632" class="h2"><tspan x="16">Hablemos de</tspan><tspan x="16" dy="38">tu alfombra</tspan></text>
  <text x="16" y="4720" class="body"><tspan x="16">La misma acción principal compilada</tspan><tspan x="16" dy="24">del Hero; sin destino paralelo.</tspan></text>
  <rect x="16" y="4794" width="358" height="54" rx="8" fill="url(#cta)" stroke="#f0dfb4"/>
  <text x="195" y="4827" text-anchor="middle" class="buttontext">SOLICITAR ESTIMADO  →</text>
