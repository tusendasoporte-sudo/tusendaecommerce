    <line x1="0" y1="844" x2="390" y2="844" class="fold"/><text x="374" y="838" text-anchor="end" class="foldtext">844</text>
    <line x1="0" y1="1688" x2="390" y2="1688" class="fold"/><text x="374" y="1682" text-anchor="end" class="foldtext">1688</text>
