<svg xmlns="http://www.w3.org/2000/svg" width="390" height="5600" viewBox="0 0 390 5600" role="img" aria-labelledby="title desc">
  <title id="title">Recorrido móvil completo en español a 390 píxeles</title>
  <desc id="desc">Mockup vertical continuo de Aladdin's Carpet con cabecera, Hero, servicios, trabajo destacado, galería, propietario, reseñas, contacto y footer. Las líneas punteadas marcan pliegues de 844 píxeles.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909"/><stop offset="1" stop-color="#17130d"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98e41"/><stop offset="1" stop-color="#ead49b"/>
    </linearGradient>
    <pattern id="media" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#171511"/>
      <path d="M0 24 24 0M-6 6 6-6M18 30 30 18" stroke="#c8a45a" stroke-opacity=".18"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#12110f"/><circle cx="3" cy="3" r="1" fill="#c8a45a" fill-opacity=".28"/>
    </pattern>
    <clipPath id="reviews"><rect x="16" y="4170" width="358" height="270" rx="8"/></clipPath>
    <style>
      .section { stroke:#c8a45a; stroke-opacity:.22; }
      .eyebrow { fill:#ead49b; font:700 10px Arial,sans-serif; letter-spacing:2px; }
      .number { fill:#ead49b; fill-opacity:.38; font:18px Georgia,serif; }
      .h1 { fill:#f6f1e7; font:41px Georgia,serif; }
      .h2 { fill:#f6f1e7; font:35px Georgia,serif; }
      .h3 { fill:#f6f1e7; font:23px Georgia,serif; }
      .body { fill:#c9c0b0; font:15px Arial,sans-serif; }
      .small { fill:#c9c0b0; font:11px Arial,sans-serif; }
      .meta { fill:#ead49b; font:700 9px Arial,sans-serif; letter-spacing:1px; }
      .buttontext { fill:#0b0b0b; font:800 12px Arial,sans-serif; letter-spacing:1.5px; }
      .card { fill:#151411; stroke:#c8a45a; stroke-opacity:.42; }
      .fold { stroke:#f0dfb4; stroke-width:1; stroke-dasharray:7 7; stroke-opacity:.6; }
      .foldtext { fill:#f0dfb4; font:700 8px Arial,sans-serif; letter-spacing:1px; }
    </style>
  </defs>

  <rect width="390" height="5600" fill="url(#page)"/>

  <!-- Header: 3 rows -->
  <rect x="0" y="0" width="390" height="140" fill="#0b0b0b" stroke="#c8a45a" stroke-opacity=".32"/>
  <text x="16" y="31" fill="#f6f1e7" font-family="Georgia,serif" font-size="20">Aladdin's Carpet</text>
  <rect x="16" y="47" width="46" height="44" rx="22" fill="#17130d" stroke="#c8a45a"/><text x="39" y="74" text-anchor="middle" class="meta">ES</text>
  <rect x="68" y="47" width="46" height="44" rx="22" fill="#0b0b0b" stroke="#5f5544"/><text x="91" y="74" text-anchor="middle" class="meta" fill="#c9c0b0">EN</text>
  <rect x="244" y="47" width="130" height="44" rx="8" fill="#11100e" stroke="#c8a45a"/>
  <rect x="256" y="60" width="18" height="18" fill="none" stroke="#ead49b"/><path d="M259 63h4v4h-4zm8 0h4v4h-4zm-8 8h4v4h-4zm8 0h4" stroke="#ead49b"/>
  <text x="326" y="74" text-anchor="middle" class="meta">MÁS ENLACES</text>
