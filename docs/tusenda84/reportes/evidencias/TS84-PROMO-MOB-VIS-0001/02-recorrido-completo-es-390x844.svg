  <rect x="16" y="2000" width="358" height="268" rx="8" fill="url(#media)" stroke="#c8a45a" stroke-opacity=".55"/>
  <rect x="31" y="2210" width="159" height="38" rx="6" fill="#0b0b0b" fill-opacity=".86" stroke="#c8a45a" stroke-opacity=".55"/>
