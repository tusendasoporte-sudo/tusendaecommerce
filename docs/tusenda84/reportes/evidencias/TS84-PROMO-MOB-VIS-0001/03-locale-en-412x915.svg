<svg xmlns="http://www.w3.org/2000/svg" width="412" height="1830" viewBox="0 0 412 1830" role="img" aria-labelledby="title desc">
  <title id="title">Exact English locale at 412 by 915</title>
  <desc id="desc">Two exact 412 by 915 mobile review frames for Aladdin's Carpet. The first shows the English header and Hero; the second shows downstream section parity, contact and footer without Spanish strings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090909"/><stop offset="1" stop-color="#17130d"/></linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98e41"/><stop offset="1" stop-color="#ead49b"/></linearGradient>
    <pattern id="media" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#151411"/><path d="M0 22 22 0M-5 5 5-5M17 27 27 17" stroke="#c8a45a" stroke-opacity=".18"/></pattern>
    <style>
      .eye{fill:#ead49b;font:700 10px Arial,sans-serif;letter-spacing:2px}.h1{fill:#f6f1e7;font:42px Georgia,serif}.h2{fill:#f6f1e7;font:34px Georgia,serif}.h3{fill:#f6f1e7;font:21px Georgia,serif}.body{fill:#c9c0b0;font:15px Arial,sans-serif}.small{fill:#c9c0b0;font:11px Arial,sans-serif}.meta{fill:#ead49b;font:700 9px Arial,sans-serif;letter-spacing:1px}.nav{fill:#c9c0b0;font:700 9px Arial,sans-serif;letter-spacing:1px}.card{fill:#151411;stroke:#c8a45a;stroke-opacity:.42}.button{fill:url(#cta);stroke:#f0dfb4}.buttontext{fill:#0b0b0b;font:800 12px Arial,sans-serif;letter-spacing:1.4px}
    </style>
  </defs>
  <rect width="412" height="1830" fill="url(#bg)"/>

  <!-- Viewport 1: 412x915 -->
  <rect width="412" height="140" fill="#0b0b0b" stroke="#c8a45a" stroke-opacity=".3"/>
  <text x="17" y="31" fill="#f6f1e7" font-family="Georgia,serif" font-size="20">Aladdin's Carpet</text>
  <rect x="17" y="47" width="48" height="44" rx="22" fill="#0b0b0b" stroke="#5f5544"/><text x="41" y="74" text-anchor="middle" class="meta" fill="#c9c0b0">ES</text>
  <rect x="71" y="47" width="48" height="44" rx="22" fill="#17130d" stroke="#c8a45a"/><text x="95" y="74" text-anchor="middle" class="meta">EN</text>
  <rect x="263" y="47" width="132" height="44" rx="8" fill="#11100e" stroke="#c8a45a"/>
  <rect x="276" y="60" width="18" height="18" fill="none" stroke="#ead49b"/><path d="M279 63h4v4h-4zm8 0h4v4h-4zm-8 8h4v4h-4zm8 0h4" stroke="#ead49b"/>
  <text x="341" y="74" text-anchor="middle" class="meta">MORE LINKS</text>
  <line x1="17" y1="101" x2="395" y2="101" stroke="#c8a45a" stroke-opacity=".22"/>
  <text x="17" y="128" class="nav">HOME · SERVICES · FEATURED · GALLERY · ABOUT · REVIEWS · CONTACT ›</text>

  <text x="17" y="195" class="eye">HOME</text><text x="380" y="191" text-anchor="end" fill="#ead49b" fill-opacity=".38" font-family="Georgia,serif" font-size="18">01</text>
  <text x="17" y="249" class="h1"><tspan x="17">Carpets</tspan><tspan x="17" dy="45">with history</tspan></text>
  <text x="17" y="359" class="body">Specialized care</text>
  <rect x="17" y="390" width="378" height="54" rx="8" class="button"/><text x="206" y="423" text-anchor="middle" class="buttontext">REQUEST AN ESTIMATE  →</text>
  <rect x="17" y="486" width="378" height="284" rx="8" fill="url(#media)" stroke="#c8a45a" stroke-opacity=".6"/>
  <text x="206" y="617" text-anchor="middle" class="meta">PUBLISHED HERO MEDIA</text>
  <text x="206" y="639" text-anchor="middle" class="small">4:3 · exact EN alt · one eager/high resource</text>
  <rect x="282" y="711" width="96" height="44" rx="22" fill="#080808" fill-opacity=".86" stroke="#f6f1e7" stroke-opacity=".3"/>
  <circle cx="309" cy="733" r="19" fill="none" stroke="#c8a45a"/><text x="309" y="737" text-anchor="middle" class="small">01</text>
  <circle cx="351" cy="733" r="19" fill="none" stroke="#c8a45a"/><text x="351" y="737" text-anchor="middle" class="small">02</text>
  <rect x="17" y="804" width="378" height="82" rx="8" fill="#11100e" stroke="#c8a45a" stroke-opacity=".32"/>
  <text x="33" y="834" class="meta">EXACT LOCALE CONTRACT</text>
  <text x="33" y="858" class="small">html[lang=en] · English aria/alt/captions</text>
  <text x="33" y="878" class="small">no Spanish strings · no per-field fallback</text>

  <line x1="0" y1="915" x2="412" y2="915" stroke="#f0dfb4" stroke-dasharray="7 7" stroke-opacity=".75"/>

  <!-- Viewport 2: same 412x915 after scroll -->
  <rect x="0" y="915" width="412" height="915" fill="#0b0b0b"/>
  <rect x="17" y="934" width="378" height="34" rx="17" fill="#17130d" stroke="#c8a45a" stroke-opacity=".5"/>
  <text x="206" y="956" text-anchor="middle" class="meta">AFTER SCROLL · SAME REVISION · SAME ACTIONS</text>

  <text x="17" y="1018" class="eye">SERVICES</text><text x="380" y="1014" text-anchor="end" fill="#ead49b" fill-opacity=".38" font-family="Georgia,serif" font-size="18">02</text>
  <text x="17" y="1065" class="h2">Published services</text>
  <g transform="translate(17 1092)">
    <rect width="184" height="136" rx="8" class="card"/><rect width="184" height="65" rx="8" fill="url(#media)"/>
    <text x="12" y="91" class="meta">SERVICE 01</text><text x="12" y="115" class="small">localized content</text>
  </g>
  <g transform="translate(211 1092)">
    <rect width="184" height="136" rx="8" class="card"/><rect width="184" height="65" rx="8" fill="url(#media)"/>
    <text x="12" y="91" class="meta">SERVICE 02</text><text x="12" y="115" class="small">no price or cart</text>
  </g>

  <text x="17" y="1274" class="eye">FUNCTIONAL PARITY</text>
  <g transform="translate(17 1292)">
    <rect width="378" height="154" rx="8" class="card"/>
    <text x="16" y="32" class="meta">FEATURED WORK</text><line x1="16" y1="43" x2="172" y2="43" stroke="#c8a45a" stroke-opacity=".35"/>
    <text x="16" y="69" class="meta">GALLERY</text><line x1="16" y1="80" x2="172" y2="80" stroke="#c8a45a" stroke-opacity=".35"/>
    <text x="16" y="106" class="meta">ABOUT</text><line x1="16" y1="117" x2="172" y2="117" stroke="#c8a45a" stroke-opacity=".35"/>
    <text x="206" y="32" class="meta">CUSTOMER REVIEWS</text>
    <text x="206" y="60" class="small">same order</text><text x="206" y="82" class="small">same published media</text><text x="206" y="104" class="small">same keyboard semantics</text><text x="206" y="126" class="small">mobile reflow only</text>
  </g>

  <text x="17" y="1496" class="eye">CONTACT</text><text x="380" y="1492" text-anchor="end" fill="#ead49b" fill-opacity=".38" font-family="Georgia,serif" font-size="18">07</text>
  <text x="17" y="1544" class="h2">Let's talk</text>
  <text x="17" y="1576" class="body">Same compiled primary action as the Hero.</text>
  <rect x="17" y="1602" width="378" height="54" rx="8" class="button"/><text x="206" y="1635" text-anchor="middle" class="buttontext">REQUEST AN ESTIMATE  →</text>

  <rect x="0" y="1694" width="412" height="136" fill="#070707" stroke="#c8a45a" stroke-opacity=".35"/>
  <text x="17" y="1730" class="h3">Aladdin's Carpet</text>
  <text x="17" y="1758" class="small">Internal links · typed social profiles · 44 px targets</text>
  <line x1="17" y1="1780" x2="395" y2="1780" stroke="#c8a45a" stroke-opacity=".25"/>
  <text x="206" y="1806" text-anchor="middle" class="small">Promo presence on <tspan fill="#f6f1e7" font-weight="800">Tu Senda 84</tspan></text>
</svg>
