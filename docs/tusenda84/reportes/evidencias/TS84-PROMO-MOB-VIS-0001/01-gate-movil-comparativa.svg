      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#17130d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b88c3c"/>
      <stop offset="1" stop-color="#ead49b"/>
    </linearGradient>
    <pattern id="media" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#171511"/>
      <path d="M0 22 22 0M-5 5 5-5M17 27 27 17" stroke="#c8a45a" stroke-opacity=".17" stroke-width="1"/>
    </pattern>
    <clipPath id="clip390"><rect x="35" y="142" width="390" height="844" rx="22"/></clipPath>
    <clipPath id="clip412"><rect x="470" y="142" width="412" height="915" rx="22"/></clipPath>
    <clipPath id="clip320"><rect x="935" y="142" width="320" height="700" rx="22"/></clipPath>
    <style>
