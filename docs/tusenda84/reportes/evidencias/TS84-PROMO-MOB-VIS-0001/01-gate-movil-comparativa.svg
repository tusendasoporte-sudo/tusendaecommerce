      .goldline { stroke:#c8a45a; stroke-width:1; }
      .note { fill:#11100e; stroke:#c8a45a; stroke-opacity:.6; }
      .notetitle { fill:#ead49b; font:700 12px Arial,sans-serif; letter-spacing:1px; }
      .notebody { fill:#c9c0b0; font:12px Arial,sans-serif; }
