  <text x="953" y="925" class="notebody"><tspan x="953">• marca sin ornamento; nombre intacto</tspan><tspan x="953" dy="22">• QR icon-only, aria-label completo</tspan><tspan x="953" dy="22">• locale, QR y nav: mínimo 44 px</tspan><tspan x="953" dy="22">• cards, media y redes: una columna</tspan><tspan x="953" dy="22">• scroll solo dentro de nav/carruseles</tspan></text>

