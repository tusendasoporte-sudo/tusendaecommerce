<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1120" viewBox="0 0 1340 1120" role="img" aria-labelledby="title desc">
  <title id="title">Comparativa del gate móvil de Aladdin's Carpet</title>
  <desc id="desc">Tres marcos exactos para 390 por 844, 412 por 915 y 320 por 700, con cabecera móvil, Hero, CTA, media y reglas de reflujo del tema negro y dorado.</desc>
  <defs>
