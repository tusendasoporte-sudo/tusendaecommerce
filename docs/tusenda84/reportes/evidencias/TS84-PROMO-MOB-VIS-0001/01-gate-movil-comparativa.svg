      .chip { fill:#14120f; stroke:#c8a45a; }
      .chiptext { fill:#ead49b; font:700 10px Arial,sans-serif; }
      .eyebrow { fill:#ead49b; font:700 10px Arial,sans-serif; letter-spacing:2px; }
      .h1 { fill:#f6f1e7; font:40px Georgia,serif; }
      .body { fill:#c9c0b0; font:16px Arial,sans-serif; }
      .small { fill:#c9c0b0; font:11px Arial,sans-serif; }
      .button { fill:url(#gold); stroke:#f0dfb4; }
