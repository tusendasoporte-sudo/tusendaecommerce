plugins {
    id 'com.android.application'
}

def firebaseConfigFile = file('google-services.json')
if (firebaseConfigFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def configuredAppName = (project.findProperty('PZ_APP_NAME') ?: 'Tu Senda 84 Admin').toString()
def configuredAdminUrl = (project.findProperty('PZ_ADMIN_URL') ?: 'https://tusenda84.com/admin').toString()
def configuredApplicationId = (project.findProperty('PZ_APPLICATION_ID') ?: 'com.tusenda84.admin').toString()
def configuredVersionCode = Integer.parseInt((project.findProperty('PZ_ADMIN_VERSION_CODE') ?: '3').toString())
def configuredVersionName = (project.findProperty('PZ_ADMIN_VERSION_NAME') ?: '1.0.2').toString()
def configuredSplashBackground = (project.findProperty('PZ_SPLASH_BACKGROUND') ?: '#FFFFFF').toString().toUpperCase()
if (configuredVersionCode < 1) throw new GradleException('PZ_ADMIN_VERSION_CODE debe ser mayor que cero.')
if (!(configuredVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) throw new GradleException('PZ_ADMIN_VERSION_NAME debe usar formato X.Y.Z.')
if (!(configuredSplashBackground ==~ /#[A-F0-9]{6}/)) throw new GradleException('PZ_SPLASH_BACKGROUND debe usar formato #RRGGBB.')
def configuredSigningProperties = (project.findProperty('PZ_ADMIN_SIGNING_PROPERTIES') ?: '').toString().trim()
def releaseKeystorePropertiesFile = configuredSigningProperties
    ? rootProject.file(configuredSigningProperties)
    : rootProject.file('../.secrets/mobile-admin-upload.properties')
def releaseKeystoreProperties = new Properties()
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile.withInputStream { stream ->
        releaseKeystoreProperties.load(stream)
    }
}
def releaseSigningConfigured = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { key ->
    releaseKeystoreProperties.getProperty(key)?.trim()
}
def releaseKeystoreFile = null
if (releaseSigningConfigured) {
    def configuredKeystore = new File(releaseKeystoreProperties.getProperty('storeFile').trim())
    releaseKeystoreFile = configuredKeystore.isAbsolute()
        ? configuredKeystore
        : new File(releaseKeystorePropertiesFile.parentFile, configuredKeystore.path)
}

def releasePackagingRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains('bundlerelease') || normalized.contains('assemblerelease')
}
if (releasePackagingRequested && !releaseSigningConfigured) {
    throw new GradleException(
        'La firma release no esta configurada. Crea .secrets/mobile-admin-upload.properties.'
    )
}

def javaStringLiteral = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.tusenda84.admin'
    compileSdk 36

    defaultConfig {
        applicationId configuredApplicationId
        minSdk 26
        targetSdk 36
        versionCode configuredVersionCode
        versionName configuredVersionName

        manifestPlaceholders = [appName: configuredAppName]
        resValue 'color', 'pz_splash_background', configuredSplashBackground
        buildConfigField 'String', 'ADMIN_URL', javaStringLiteral(configuredAdminUrl)
        buildConfigField 'String', 'APP_DISPLAY_NAME', javaStringLiteral(configuredAppName)
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigFile.exists().toString()
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile releaseKeystoreFile
                storePassword releaseKeystoreProperties.getProperty('storePassword')
                keyAlias releaseKeystoreProperties.getProperty('keyAlias')
                keyPassword releaseKeystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
}
